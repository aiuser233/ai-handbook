<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Handbook · 个人学习笔记</title>
  <meta name="description" content="公开的 AI 工作学习笔记：概念、工具、数据报告、Skill、模板与验证。更新于 2026-10-12。">
  <style>
    :root {
      --bg:#ffffff; --fg:#1a1a1a; --muted:#66707a; --border:#e3e6ea; --card:#f6f8fa;
      --accent:#1d4ed8; --accent-soft:#eef4ff; --code-bg:#0d1117; --code-fg:#e6edf3;
      --topbar-bg:rgba(255,255,255,.92);
      --p0:#64748b; --p1:#1d4ed8; --p2:#0f766e; --p3:#7c3aed; --p4:#b45309; --p5:#0ea5e9;
    }
    [data-theme="dark"] {
      --bg:#0f1115; --fg:#d7dbe0; --muted:#8b94a0; --border:#262c35; --card:#171b22;
      --accent:#7aa2ff; --accent-soft:#1a2436; --code-bg:#0a0c10; --code-fg:#d6deeb;
      --topbar-bg:rgba(15,17,21,.9);
      --p0:#8494ab; --p1:#7aa2ff; --p2:#4fd1c5; --p3:#a78bfa; --p4:#f59e0b; --p5:#38bdf8;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.75; font-size:15.5px; }
    h1 { border-bottom:2px solid var(--fg); padding-bottom:.4rem; line-height:1.35; }
    h2 { border-bottom:1px solid var(--border); padding-bottom:.45rem; margin-top:2.4rem; scroll-margin-top:70px;
      border-left:none; }
    h2[data-part] { padding-left:.7rem; border-left:4px solid var(--pc);
      background:linear-gradient(90deg, color-mix(in srgb, var(--pc) 7%, transparent), transparent 65%);
      border-radius:0 8px 8px 0; }
    h2 .h2-en { display:block; font-size:.6em; font-weight:500; color:var(--muted); letter-spacing:.1em;
      margin-top:.2rem; font-family:"Cascadia Code",Consolas,"SF Mono",monospace; }
    h3 { margin-top:1.8rem; scroll-margin-top:70px; padding-left:.5rem; border-left:2px solid var(--border); }
    h4 { margin-top:1.4rem; scroll-margin-top:70px; }
    h4::before { content:"◈ "; color:var(--accent); font-size:.85em; }
    a { color:var(--accent); }
    code { background:var(--card); border:1px solid var(--border); padding:2px 5px; border-radius:5px;
      font-family:"Cascadia Code",Consolas,"SF Mono",monospace; font-size:.88em; }
    pre { background:var(--code-bg); color:var(--code-fg); padding:14px 16px; border-radius:10px;
      overflow:auto; line-height:1.55; position:relative; }
    pre code { background:none; border:none; padding:0; color:inherit; }
    .langlab { position:absolute; top:8px; left:12px; font-size:.7rem; color:#9aa4b2;
      font-family:Consolas,monospace; letter-spacing:.03em; }
    table { border-collapse:separate; border-spacing:0; width:100%; margin:1.1rem 0; font-size:.93em;
      border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    th, td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { background:var(--card); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    blockquote { border-left:4px solid var(--accent); background:var(--accent-soft);
      margin:1.1rem 0; padding:.55rem 1rem; border-radius:0 10px 10px 0; position:relative; }
    blockquote p { margin:.35rem 0; }
    blockquote::before { content:attr(data-icon); margin-right:.45rem; }
    .callout-lab { position:absolute; top:.4rem; right:.6rem; font-size:.68rem; font-weight:600;
      color:var(--accent); background:var(--bg); border:1px solid var(--border);
      padding:1px 8px; border-radius:99px; opacity:.85; letter-spacing:.05em; }
    hr { border:none; border-top:1px solid var(--border); margin:2.2rem 0; }
    /* ===== Part 视觉架构 ===== */
    .part-header { margin:3.2rem 0 .9rem; padding:.5rem .85rem; border-radius:8px;
      font-size:.88rem; font-weight:700; letter-spacing:.02em; color:var(--fg);
      border-left:4px solid var(--pc); background:color-mix(in srgb, var(--pc) 9%, transparent); }
    .part-header .ph-part { color:var(--pc); margin-right:.6rem; font-weight:800; }
    .part-header .ph-sub { font-weight:400; color:var(--muted); font-size:.82em; margin-left:.6rem; }
    .part-header.ph-first { margin-top:1rem; }
    .part-header.ph-ref { background:none; border-left:none; border-top:1px solid var(--border);
      padding-top:.9rem; border-radius:0; }
    .ch-card[data-part] { border-left:3px solid var(--pc); }
    /* ===== Part 主题色 ===== */
    [data-part="p0"] { --pc:var(--p0); } [data-part="p1"] { --pc:var(--p1); }
    [data-part="p2"] { --pc:var(--p2); } [data-part="p3"] { --pc:var(--p3); }
    [data-part="p4"] { --pc:var(--p4); } [data-part="p5"] { --pc:var(--p5); }
    h3[data-part] { border-left-color:var(--pc); }
    h3[data-part] .h3-en { color:var(--pc); }
    .toc-sec[data-part] > a.lv1 { color:var(--pc); }
    .toc-sec[data-part] > a.lv1:hover { color:var(--pc); }
    .toc-sec[data-part] > a.lv1.active { color:var(--pc); border-left-color:var(--pc);
      background:color-mix(in srgb, var(--pc) 14%, transparent); }
    /* ===== 进度条 / 顶栏 ===== */
    .progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; z-index:60; }
    .topbar { position:sticky; top:0; background:var(--topbar-bg); backdrop-filter:blur(6px);
      z-index:50; border-bottom:1px solid var(--border); }
    .topbar .row { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:.8rem;
      padding:.5rem 1rem; flex-wrap:wrap; }
    .brand { font-weight:700; white-space:nowrap; }
    .chips { display:flex; gap:.4rem; flex-wrap:wrap; flex:1; align-items:center; }
    .chips a { font-size:.8rem; text-decoration:none; padding:3px 9px; border-radius:6px;
      background:var(--card); color:var(--fg); border:1px solid var(--border); }
    .chips a:hover { border-color:var(--accent); color:var(--accent); }
    .chips a.pd { border-left:2px solid var(--muted); }
    .chips .chip-sep { font-size:.66rem; color:var(--muted); letter-spacing:.06em; margin:0 .2rem .1rem; }
    #themeBtn { border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
    #navBtn { display:none; border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
    /* ===== 布局 ===== */
    .layout { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:270px minmax(0,1fr);
      gap:2rem; padding:1.5rem 1rem 4rem; align-items:start; }
    .doc { min-width:0; }
    .sidebar { position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto;
      font-size:12.5px; border-right:1px solid var(--border); padding-right:1rem; }
    .side-title { font-weight:700; margin:.4rem 0 .6rem; color:var(--muted); letter-spacing:.05em; }
    .toc a { display:block; color:var(--muted); text-decoration:none; padding:2px 8px;
      border-left:2px solid transparent; border-radius:0 6px 6px 0; }
    .toc a:hover { color:var(--accent); }
    .toc a.active { color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); font-weight:600; }
    .toc-part { font-size:.68rem; font-weight:700; letter-spacing:.05em; color:var(--pc);
      margin:.8rem 0 .2rem .2rem; opacity:.9; }
    .toc-part::before { content:""; display:inline-block; width:8px; height:8px; border-radius:2px;
      background:var(--pc); margin-right:.4rem; vertical-align:baseline; }
    .toc-sec { margin-top:3px; }
    .toc .lv1 { font-weight:600; cursor:pointer; }
    .toc .lv1::after { content:"▸"; float:right; font-size:10px; color:var(--muted); margin-left:auto; }
    .toc-sec.open .lv1::after { content:"▾"; }
    .toc-sec.empty .lv1::after { content:""; }
    .toc-sub { display:none; margin-top:2px; }
    .toc-sec.open > .toc-sub { display:block; }
    .toc .lv2 { display:block; padding-left:20px; font-size:11.5px; }
    .toc .lv3 { display:block; padding-left:38px; font-size:11px; }
    .toc-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.7rem; margin:1rem 0; }
    .toc-part-label { grid-column:1/-1; font-size:.78rem; font-weight:700; color:var(--pc);
      letter-spacing:.04em; margin-top:.45rem; padding-left:.15rem; }
    .toc-part-label::before { content:""; display:inline-block; width:9px; height:9px; border-radius:2px;
      background:var(--pc); margin-right:.45rem; }
    .toc-card { display:block; text-decoration:none; color:var(--fg); background:var(--card);
      border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; transition:.15s; }
    .toc-card:hover { border-color:var(--accent); transform:translateY(-2px);
      box-shadow:0 3px 10px rgba(0,0,0,.07); }
    .toc-card .no { font-size:.72rem; font-weight:700; color:var(--pc, var(--accent)); letter-spacing:.04em; }
    .toc-card .tt { font-weight:700; margin:.15rem 0 .2rem; font-size:.95rem; }
    .toc-card .desc { font-size:.8rem; color:var(--muted); line-height:1.5; }
    .copybtn { position:absolute; top:8px; right:8px; font-size:.72rem; color:#9aa4b2;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
      padding:2px 9px; border-radius:6px; cursor:pointer; opacity:0; transition:.15s; }
    pre:hover .copybtn { opacity:1; }
    .backtop { display:inline-block; margin-top:1rem; font-size:.8rem; color:var(--muted); text-decoration:none; }
    /* ===== 批注角标 ===== */
    .anno { position:relative; cursor:help; }
    .anno::after { content:"①"; }
    .anno[data-anno-i="2"]::after { content:"②"; }
    .anno[data-anno-i="3"]::after { content:"③"; }
    .anno[data-anno-i="4"]::after { content:"④"; }
    .anno[data-anno-i="5"]::after { content:"⑤"; }
    .anno[data-anno-i="6"]::after { content:"⑥"; }
    .anno[data-anno-i="7"]::after { content:"⑦"; }
    .anno[data-anno-i="8"]::after { content:"⑧"; }
    .anno[data-anno-i="9"]::after { content:"⑨"; }
    .anno[data-anno-i="10"]::after { content:"⑩"; }
    .anno::after { position:absolute; top:-1.15em; left:0; margin-left:-1.25em;
      font-size:.78em; color:var(--accent); font-weight:700; }
    .anno::before { content:""; position:absolute; inset:-4px -6px; border-radius:6px; transition:.15s; }
    .anno:hover::before { background:var(--accent-soft); }
    .anno-pop { position:fixed; z-index:100; max-width:420px; display:none;
      background:var(--card); color:var(--fg); border:1px solid var(--accent);
      border-radius:10px; padding:.8rem 1rem; font-size:.9rem; line-height:1.65;
      box-shadow:0 8px 24px rgba(0,0,0,.18); }
    .anno-pop .ttl { font-weight:700; color:var(--accent); display:block; margin-bottom:.3rem; }
    .anno-pop ul { margin:.35rem 0 0; padding-left:1.2rem; }
    /* ===== 邀请码门 ===== */
    .invite-gate { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
      background:var(--bg); padding:1rem; }
    .invite-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:1.5rem 1.6rem; width:min(360px,92vw); box-shadow:0 12px 40px rgba(0,0,0,.15); }
    .invite-brand { font-weight:700; font-size:1.05rem; margin-bottom:.4rem; }
    .invite-hint { color:var(--muted); font-size:.9rem; line-height:1.6; margin-bottom:1rem; }
    #inviteForm { display:flex; gap:.5rem; }
    #inviteInput { flex:1; min-width:0; padding:.5rem .7rem; border:1px solid var(--border); border-radius:8px;
      background:var(--bg); color:var(--fg); font-size:.95rem; }
    #inviteInput:focus { outline:none; border-color:var(--accent); }
    #inviteBtn { padding:.5rem 1rem; border:1px solid var(--accent); background:var(--accent); color:#fff;
      border-radius:8px; cursor:pointer; font-size:.9rem; white-space:nowrap; }
    #inviteBtn:disabled { opacity:.5; cursor:wait; }
    .invite-err { color:#c0392b; font-size:.85rem; margin-top:.6rem; }
    .invite-note { color:var(--muted); font-size:.78rem; margin-top:1rem; }
    /* ===== 移动端目录抽屉 ===== */
    #scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; }
    @media (max-width:1050px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:45; width:285px; max-width:84vw;
        background:var(--bg); max-height:none; border-right:1px solid var(--border);
        padding:1rem; margin:0; transform:translateX(-105%); transition:transform .25s ease; }
      .sidebar.open { transform:none; box-shadow:8px 0 30px rgba(0,0,0,.15); }
      #navBtn { display:inline-block; }
      body.nav-open #scrim { display:block; }
      .chips .chip-sep { display:none; }
    }
    /* ===== Reading-first layout refresh ===== */
    :root { --bg:#f4f6f8; --surface:#fff; --surface-2:#f8fafc; --fg:#17202b; --muted:#667384; --faint:#8c98a6; --border:#e3e8ee; --accent:#3159d8; --accent-soft:#eef2ff; --shadow:0 14px 42px rgba(30,45,65,.08); }
    [data-theme="dark"] { --bg:#0e131b; --surface:#151c26; --surface-2:#1a2330; --fg:#e7edf5; --muted:#9aa7b6; --faint:#718094; --border:#293545; --accent:#8ca8ff; --accent-soft:#202c49; --shadow:0 16px 45px rgba(0,0,0,.22); }
    body { background:var(--bg); color:var(--fg); font-size:15.5px; }
    .topbar { background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(14px); }
    .topbar .row { max-width:1380px; min-height:64px; padding:10px 24px; gap:16px; }
    .brand { display:flex; align-items:center; gap:10px; letter-spacing:-.02em; }
    .brand::first-letter { color:var(--accent); }
    .chips { gap:6px; overflow:auto; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chips a { padding:6px 10px; border-radius:8px; color:var(--muted); }
    .chips a:hover,.chips a.pd { color:var(--accent); background:var(--accent-soft); }
    .layout { max-width:1720px; padding:30px 24px 80px; grid-template-columns:232px minmax(0,1fr); gap:28px; }
    .sidebar { top:88px; max-height:calc(100vh - 112px); padding:0 18px 0 0; }
    .side-title { font-size:18px; letter-spacing:-.02em; }
    .toc-part { margin:20px 0 6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .toc a { padding:5px 9px; border-radius:0 8px 8px 0; font-size:12px; line-height:1.45; }
    .toc .lv1 { color:var(--fg); font-weight:650; }
    .toc a:hover { background:var(--surface-2); }
    .doc { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:42px 30px 76px; }
    .doc #doc > h1 { margin-top:0; padding-bottom:24px; border-bottom:1px solid var(--border); font-size:clamp(2rem,4vw,3.1rem); line-height:1.15; letter-spacing:-.05em; }
    .doc #doc > h1 + p { color:var(--muted); font-size:17px; }
    h2 { margin:70px 0 19px; padding:16px 18px 13px; border:1px solid color-mix(in srgb,var(--pc) 22%,var(--border)); border-left:5px solid var(--pc); border-radius:12px; background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 8%,transparent),transparent 70%); }
    h2:first-of-type { margin-top:36px; }
    h2 .h2-en { margin-top:5px; color:var(--pc); font-size:10px; }
    h3 { margin-top:40px; padding-left:12px; border-left:3px solid var(--pc); }
    h4 { margin-top:28px; }
    p { margin:12px 0; } li+li { margin-top:5px; }
    .part-header { margin:42px 0 -34px; padding:0; color:var(--muted); background:none; border:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .part-header .ph-part { color:var(--pc); }
    blockquote { padding:12px 17px; border-radius:0 12px 12px 0; }
    pre { padding:18px 20px; border-radius:12px; }
    table { border-radius:12px; }
    .toc-cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .toc-card { padding:15px 16px; border-radius:11px; background:var(--surface-2); }
    .toc-card:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(30,45,65,.08); }
    @media (max-width:1050px) { .chips { display:none; } .layout { grid-template-columns:1fr; padding:20px 16px 50px; } .sidebar { top:0; width:min(310px,88vw); max-height:none; padding:25px 20px; background:var(--surface); transform:translateX(-105%); } .doc { padding:30px 25px 55px; } }
    @media (max-width:620px) { .doc { border-radius:14px; padding:25px 18px 45px; } .doc #doc > h1 { font-size:2rem; } h2 { margin-top:50px; padding:13px; } .toc-cards { grid-template-columns:1fr; } }

    [hidden] { display:none !important; }
    .sr-only { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap; }
    .reading-links { font-size:.8rem;color:var(--muted); }
    .toc-heading-row { display:flex;align-items:center;gap:4px; }
    .toc-heading-row a { flex:1; }
    .toc .lv1::after { content:none !important; }
    .toc-toggle,#closeNav,#closeAnno { border:0;background:transparent;color:var(--fg);cursor:pointer;padding:5px 8px; }
    .toc .lv3 { display:block;padding-left:28px;font-size:11px; }
    #closeNav { display:none;float:right; }
    .anno { font:inherit;color:inherit;background:none;border:0;border-bottom:1px dotted var(--accent);padding:0;cursor:pointer;text-align:left; }
    .anno::before { pointer-events:none; }
    .anno::after { content:attr(data-anno-i) !important;position:static;margin-left:3px;vertical-align:super; }
    .anno-pop { display:block;width:calc(100vw - 24px);max-height:calc(100vh - 16px);overflow:auto; }
    #closeAnno { float:right; }
    .copybtn { opacity:1; }
    pre { padding-top:44px; }
    pre.prompt-code code { white-space:pre-wrap;overflow-wrap:anywhere; }
    .table-scroll { overflow-x:auto;max-width:100%;margin:1rem 0; }
    .table-scroll table { min-width:550px;margin:0; }
    a:focus-visible,button:focus-visible,.table-scroll:focus-visible { outline:3px solid var(--accent);outline-offset:3px; }
    .public-read { width:100%;margin-top:12px;padding:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:8px;cursor:pointer; }
    @media(max-width:1050px) { #navBtn,#closeNav { display:inline-block; } .sidebar { position:fixed;left:0;bottom:0;z-index:55; } #scrim { z-index:54; } .sidebar.open { transform:none; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition:none !important;animation:none !important; } }
    @media print { .topbar,.sidebar,.progress,.invite-gate,.anno-pop,.copybtn,.toc-cards,.reading-links,#scrim,#err { display:none !important; } body { background:#fff;color:#000;font-size:11pt; } .layout { display:block;margin:0;padding:0; } .doc { border:0;box-shadow:none;padding:0; } h2,h3,h4 { break-after:avoid; } pre { padding:10px;white-space:pre-wrap;background:#f4f4f4;color:#000; } pre code { color:#000;white-space:pre-wrap;overflow-wrap:anywhere; } .table-scroll { overflow:visible; } table { min-width:0 !important;font-size:9pt; } h2 { margin-top:24px; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar" id="top">
    <div class="row">
      <button id="navBtn" title="目录" aria-label="打开目录" aria-controls="side" aria-expanded="false">☰</button>
      <span class="brand">📗 AI Handbook</span>
      <nav class="chips" aria-label="章节快捷导航">
        <a href="#ch0">目录</a>
        <a href="#ch1" class="pd">核心概念</a><a href="#ch2">平台</a>
        <a href="#ch3" class="pd">安全合规</a><a href="#ch4">Skill</a><a href="#ch5">Skill实例</a>
        <a href="#ch6" class="pd">Git</a><a href="#ch7" class="pd">Cloudflare</a>
        <a href="#ch8" class="pd">成本</a><a href="#ch9" class="pd">FAQ</a><a href="#ch10">术语表</a><a href="#appA">模板库</a><a href="#appB">实践</a>
      </nav>
      <button id="themeBtn" title="切换明暗模式">🌙</button>
    </div>
  </header>
  <div id="scrim"></div>
  <div class="layout">
    <aside class="sidebar" id="side">
      <div class="side-title">目录导航 <button id="closeNav" aria-label="关闭目录">×</button></div>
      <nav id="toc" class="toc" aria-label="正文目录"></nav>
      <a class="backtop" href="#top">↑ 回到顶部</a>
    </aside>
