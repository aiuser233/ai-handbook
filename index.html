<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Handbook</title>
  <style>
    :root { --fg:#1a1a1a; --muted:#666; --border:#e3e6ea; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem;
           font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           line-height: 1.75; color: var(--fg); }
    h1 { border-bottom: 2px solid #333; padding-bottom: .4rem; }
    h2 { border-bottom: 1px solid var(--border); padding-bottom: .3rem; margin-top: 2.2rem; }
    h3 { margin-top: 1.6rem; }
    code { background: #f3f4f6; padding: 2px 5px; border-radius: 4px;
           font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: .92em; }
    pre { background: #0d1117; color: #e6edf3; padding: 14px 16px; border-radius: 8px;
          overflow: auto; line-height: 1.5; }
    pre code { background: none; padding: 0; color: inherit; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95em; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; }
    blockquote { border-left: 4px solid #3b82f6; margin: 1rem 0; padding: .4rem 1rem;
                 background: #f0f6ff; border-radius: 0 6px 6px 0; color: #333; }
    blockquote p { margin: .3rem 0; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .badge { display: inline-block; background: #eef4ff; color: #1d4ed8; font-size: .8rem;
             padding: 2px 10px; border-radius: 99px; margin-left: .5rem; vertical-align: middle; }
    a { color: #1d4ed8; }
    .topbar { position: sticky; top: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(4px);
              z-index: 10; padding: .6rem 0; border-bottom: 1px solid var(--border);
              margin: -1.5rem -1.25rem 1.5rem; padding-left: 1.25rem; padding-right: 1.25rem; }
    .topbar .row { display: flex; gap: .5rem; flex-wrap: wrap; }
    .topbar a { font-size: .85rem; text-decoration: none; padding: 3px 10px; border-radius: 6px;
                background: #f3f4f6; color: #333; }
    .topbar a:hover { background: #e5e7eb; }
    #loading, #err { padding: 2rem 0; color: var(--muted); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <a href="#ch0">目录</a><a href="#ch1">核心概念</a><a href="#ch2">平台</a>
      <a href="#ch3">安全合规</a><a href="#ch4">Skill</a><a href="#ch5">Skill实例</a>
      <a href="#ch6">金融工作流</a><a href="#ch7">Git</a><a href="#ch8">Cloudflare</a>
      <a href="#ch9">FAQ</a><a href="#ch10">术语表</a><a href="#appA">模板库</a>
    </div>
  </div>
  <div id="loading">正在加载手册…</div>
  <div id="doc"></div>
  <div id="err" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async () => {
      const doc = document.getElementById('doc');
      const err = document.getElementById('err');
      try {
        const res = await fetch('index.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        doc.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        // 为章节标题(h2)按顺序生成锚点 ch0..ch10, appA, appB
        doc.querySelectorAll('h2').forEach((h, i) => {
          h.id = i <= 10 ? 'ch' + i : (i === 11 ? 'appA' : 'appB');
        });
        document.getElementById('loading').remove();
      } catch (e) {
        document.getElementById('loading').remove();
        err.style.display = 'block';
        err.innerHTML = '<p>加载 index.md 失败：' + e +
          '</p><p>请确认 index.md 与 index.html 在同一目录（仓库根目录）。</p>';
      }
    })();
  </script>
</body>
</html>
