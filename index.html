<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Handbook</title>
  <style>
    :root {
      --bg:#ffffff; --fg:#1a1a1a; --muted:#66707a; --border:#e3e6ea; --card:#f6f8fa;
      --accent:#1d4ed8; --accent-soft:#eef4ff; --code-bg:#0d1117; --code-fg:#e6edf3;
      --topbar-bg:rgba(255,255,255,.92);
    }
    [data-theme="dark"] {
      --bg:#0f1115; --fg:#d7dbe0; --muted:#8b94a0; --border:#262c35; --card:#171b22;
      --accent:#7aa2ff; --accent-soft:#1a2436; --code-bg:#0a0c10; --code-fg:#d6deeb;
      --topbar-bg:rgba(15,17,21,.9);
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.75; font-size:15.5px; }
    h1 { border-bottom:2px solid var(--fg); padding-bottom:.4rem; line-height:1.35; }
    h2 { border-bottom:1px solid var(--border); padding-bottom:.35rem; margin-top:2.6rem; scroll-margin-top:70px; }
    h3 { margin-top:1.8rem; scroll-margin-top:70px; }
    a { color:var(--accent); }
    code { background:var(--card); border:1px solid var(--border); padding:2px 5px; border-radius:5px;
      font-family:"Cascadia Code",Consolas,"SF Mono",monospace; font-size:.88em; }
    pre { background:var(--code-bg); color:var(--code-fg); padding:14px 16px; border-radius:10px;
      overflow:auto; line-height:1.55; position:relative; }
    pre code { background:none; border:none; padding:0; color:inherit; }
    table { border-collapse:separate; border-spacing:0; width:100%; margin:1.1rem 0; font-size:.93em;
      border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    th, td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { background:var(--card); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    blockquote { border-left:4px solid var(--accent); background:var(--accent-soft);
      margin:1.1rem 0; padding:.55rem 1rem; border-radius:0 10px 10px 0; }
    blockquote p { margin:.35rem 0; }
    blockquote::before { content:attr(data-icon); margin-right:.45rem; }
    hr { border:none; border-top:1px solid var(--border); margin:2.2rem 0; }
    .progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; z-index:60; }
    .topbar { position:sticky; top:0; background:var(--topbar-bg); backdrop-filter:blur(6px);
      z-index:50; border-bottom:1px solid var(--border); }
    .topbar .row { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:.8rem;
      padding:.5rem 1rem; flex-wrap:wrap; }
    .brand { font-weight:700; white-space:nowrap; }
    .chips { display:flex; gap:.4rem; flex-wrap:wrap; flex:1; }
    .chips a { font-size:.8rem; text-decoration:none; padding:3px 9px; border-radius:6px;
      background:var(--card); color:var(--fg); border:1px solid var(--border); }
    .chips a:hover { border-color:var(--accent); color:var(--accent); }
    #themeBtn { border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
    .layout { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:270px minmax(0,1fr);
      gap:2rem; padding:1.5rem 1rem 4rem; align-items:start; }
    .doc { min-width:0; }
    .sidebar { position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto;
      font-size:12.5px; border-right:1px solid var(--border); padding-right:1rem; }
    .side-title { font-weight:700; margin:.4rem 0 .6rem; color:var(--muted); letter-spacing:.05em; }
    .toc a { display:block; color:var(--muted); text-decoration:none; padding:2px 8px;
      border-left:2px solid transparent; border-radius:0 6px 6px 0; }
    .toc a:hover { color:var(--accent); }
    .toc a.active { color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); font-weight:600; }
    .toc .lv1 { font-weight:600; margin-top:5px; }
    .toc .lv2 { padding-left:20px; font-size:11.5px; }
    .toc-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.7rem; margin:1rem 0; }
    .toc-card { display:block; text-decoration:none; color:var(--fg); background:var(--card);
      border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; transition:.15s; }
    .toc-card:hover { border-color:var(--accent); transform:translateY(-2px);
      box-shadow:0 3px 10px rgba(0,0,0,.07); }
    .toc-card .no { font-size:.72rem; font-weight:700; color:var(--accent); letter-spacing:.04em; }
    .toc-card .tt { font-weight:700; margin:.15rem 0 .2rem; font-size:.95rem; }
    .toc-card .desc { font-size:.8rem; color:var(--muted); line-height:1.5; }
    .copybtn { position:absolute; top:8px; right:8px; font-size:.72rem; color:#9aa4b2;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
      padding:2px 9px; border-radius:6px; cursor:pointer; opacity:0; transition:.15s; }
    pre:hover .copybtn { opacity:1; }
    .backtop { display:inline-block; margin-top:1rem; font-size:.8rem; color:var(--muted); text-decoration:none; }
    /* ===== 批注角标 ===== */
    .anno { position:relative; cursor:help; }
    .anno::after { content:"①"; }
    .anno[data-anno-i="2"]::after { content:"②"; }
    .anno[data-anno-i="3"]::after { content:"③"; }
    .anno[data-anno-i="4"]::after { content:"④"; }
    .anno[data-anno-i="5"]::after { content:"⑤"; }
    .anno[data-anno-i="6"]::after { content:"⑥"; }
    .anno[data-anno-i="7"]::after { content:"⑦"; }
    .anno[data-anno-i="8"]::after { content:"⑧"; }
    .anno[data-anno-i="9"]::after { content:"⑨"; }
    .anno[data-anno-i="10"]::after { content:"⑩"; }
    .anno::after { position:absolute; top:-1.15em; left:0; margin-left:-1.25em;
      font-size:.78em; color:var(--accent); font-weight:700; }
    .anno::before { content:""; position:absolute; inset:-4px -6px; border-radius:6px; transition:.15s; }
    .anno:hover::before { background:var(--accent-soft); }
    /* 悬浮批注卡片（由 JS 挂到 body，定位到角标旁） */
    .anno-pop { position:fixed; z-index:100; max-width:420px; display:none;
      background:var(--card); color:var(--fg); border:1px solid var(--accent);
      border-radius:10px; padding:.8rem 1rem; font-size:.9rem; line-height:1.65;
      box-shadow:0 8px 24px rgba(0,0,0,.18); }
    .anno-pop .ttl { font-weight:700; color:var(--accent); display:block; margin-bottom:.3rem; }
    .anno-pop ul { margin:.35rem 0 0; padding-left:1.2rem; }
    @media (max-width:1000px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { display:none; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar" id="top">
    <div class="row">
      <span class="brand">📗 AI Handbook</span>
      <nav class="chips">
        <a href="#ch0">目录</a><a href="#ch1">核心概念</a><a href="#ch2">平台</a>
        <a href="#ch3">安全合规</a><a href="#ch4">Skill</a><a href="#ch5">Skill实例</a>
        <a href="#ch6">Git</a><a href="#ch7">Cloudflare</a>
        <a href="#ch8">FAQ</a><a href="#ch9">术语表</a><a href="#appA">模板库</a>
      </nav>
      <button id="themeBtn" title="切换明暗模式">🌙</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">目录导航</div>
      <nav id="toc" class="toc"></nav>
      <a class="backtop" href="#top">↑ 回到顶部</a>
    </aside>
    <div class="doc">
      <div id="loading" style="color:var(--muted)">正在加载…</div>
      <div id="err" style="display:none;color:#c0392b"></div>
      <div id="doc" style="display:none"></div>
    </div>
  </div>
  <div class="anno-pop" id="annoPop"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  /* ========= 批注定义（以后要加批注，只改这个数组） =========
     anchor: 正文里出现过的短语（首次出现处插角标）
     title / html: 悬浮显示内容（html 可用 <ul>/<b> 等简单标签）
     注意：anchor 必须与 index.md 中的文字完全一致，写错了不会报错，只是不显示。 */
  const ANNOS = [
    {
      anchor: '请输出 JSON，字段为',
      title: '💡 批注：这个 JSON 示例好在哪',
      html: `
        <b>核心优势</b>：把 AI 输出从"给人看的段落"变成"给程序用的数据"。
        <ul>
          <li><b>机器可读</b>：输出可直接 <code>json.loads()</code> → <code>DataFrame</code> → Excel，"AI 提取 → 汇总 50 家 → 出对比表"全自动</li>
          <li><b>口径统一</b>：字段固定 = 每家都是同样 5 列，批量结果能逐列横向比较</li>
          <li><b>缺失显式</b>：约定"缺失填 null"，能区分"值为 0"和"未披露"——尽调/审计关键</li>
          <li><b>可校验可审计</b>：配 JSON Schema 自动查字段齐全/类型；每条 JSON 存库留痕</li>
          <li><b>Agent 通用接口</b>：function calling 的标准格式就是 JSON，后面接数据库、第二个 AI 核对、可视化看板都无障碍</li>
        </ul>
        <b>两个注意点</b>：① JSON 只管"结构"，不管"准确"——数字仍需对原文复核；② "一句话风险"这类自由文本字段要加约束（限字数、只写原文有的），否则模型会塞进发散内容。`
    },
    {
      anchor: '（主分支）上保持',
      title: '① 批注：这条是什么意思',
      html: `
        <b>main（主分支）</b>= 全团队共享的"已发布"基线，随时可打包、交付、上线。
        <ul>
          <li>"随时可交付的干净状态" = <b>main 上永远只放"能交付"的代码</b>，不直接在上面试验、乱改。</li>
          <li>所有试验性的改动都先在"试验线"（feature 分支）上做，验收通过才合回 main。</li>
          <li>类比：main 是"已签字定稿的研报"，只有审完的结论才写进去。</li>
        </ul>`
    },
    {
      anchor: '做新功能/新分析：',
      title: '② 批注：这条是什么意思',
      html: `
        从 main 拉一条<b>试验线（feature 分支）</b>再动手：
        <ul>
          <li><code>git switch -c feature/xxx</code> = 新建一个名为 feature/xxx 的分支并<b>立刻切过去</b>（-c = create 的缩写）。</li>
          <li>之后 <b>改代码 → commit（存档）→ push（推上 GitHub）</b>，全程在试验线上进行。</li>
          <li>好处：这条线改崩了，main 完全不受影响，随时能丢弃重来。</li>
          <li>分支名习惯：<code>feature/</code>（新功能）、<code>fix/</code>（修 bug）、<code>analysis/</code>（新分析）。</li>
        </ul>`
    },
    {
      anchor: '，让同事 review，通过后合并',
      title: '③ 批注：这条是什么意思',
      html: `
        <b>Pull Request（PR，合并请求）</b>= 把试验线的改动"请求"合回 main 的<b>正式通道</b>：
        <ul>
          <li>你在 GitHub 上发起 PR 后，同事会看到<b>diff（改动对比）</b>，逐行 review、提意见、通过（approve）后才合并。</li>
          <li>合并后 main 多了这批改动，所有人再 <code>git pull</code> 即可同步。</li>
          <li>金融价值：PR 就是"<b>变更审批 + 留痕</b>"——谁提的、改了什么、谁批的、何时合的，平台全程记录，天然契合合规。</li>
        </ul>`
    },
    {
      anchor: '合并后删除临时分支',
      title: '④ 批注：这条是什么意思',
      html: `
        试验线（feature 分支）使命完成，<b>删掉保持整洁</b>：
        <ul>
          <li>合并进 main 后，这条分支的改动已经"进家"了，留在本地/远端只是累赘，容易让分支列表越来越乱。</li>
          <li>本地删：<code>git branch -d feature/xxx</code>；远端删：<code>git push origin --delete feature/xxx</code>。</li>
          <li><b>不用担心丢失</b>：改动都在 main 的 commit 历史里，<code>git log</code> 可全程追溯。</li>
        </ul>`
    },
    {
      anchor: '当作功能分支开发',
      title: '⑤ 批注：这条是什么意思',
      html: `
        把每个<b>分析脚本 / 自动化任务</b>都当成"开发一个功能"来走完整流程：
        <ul>
          <li>一条新的财务分析脚本、一个周报自动化 → 各自开 feature 分支开发 → review → 合并。</li>
          <li>每步 <code>commit</code> 写清 message（谁、何时、为什么、改了什么），于是自然形成一条<b>可审计的变更链</b>。</li>
          <li>出问题可用 <code>git log</code> / <code>git revert</code> 定位并回滚——这正是金融"留痕、可追溯、可追责"文化的技术落地。</li>
        </ul>`
    }
  ];
  /* ============================================================ */

  (async () => {
    const $ = s => document.querySelector(s);

    /* 明暗模式 */
    const root = document.documentElement;
    let theme = localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const applyTheme = t => { theme = t; root.setAttribute('data-theme', t);
      $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; };
    applyTheme(theme);
    $('#themeBtn').onclick = () => { applyTheme(theme === 'dark' ? 'light' : 'dark');
      localStorage.setItem('theme', theme); };

    try {
      const res = await fetch('index.md', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      const doc = $('#doc');
      doc.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      $('#loading').remove();
      doc.style.display = 'block';

      /* 锚点：h2 -> ch0..ch9, appA, appB；h3 -> s0.. */
      doc.querySelectorAll('h2').forEach((h, i) => {
        h.id = i <= 9 ? 'ch' + i : (i === 10 ? 'appA' : 'appB');
      });
      doc.querySelectorAll('h3').forEach((h, i) => { h.id = 's' + i; });

      /* 侧边目录（两级） */
      const toc = $('#toc');
      doc.querySelectorAll('h2, h3').forEach(h => {
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.className = h.tagName === 'H2' ? 'lv1' : 'lv2';
        toc.appendChild(a);
      });

      /* 滚动高亮：随正文滚动，左侧目录自动跟随（比 IntersectionObserver 更稳，
         快滚不会乱跳；并把当前项保持在侧栏可见，但不干扰正文滚动） */
      const links = Array.from(toc.children);
      const byId = {};
      links.forEach(a => byId[a.getAttribute('href').slice(1)] = a);
      const heads = Array.from(doc.querySelectorAll('h2[id], h3[id]'));
      const sb = document.querySelector('.sidebar');
      const setActive = id => {
        links.forEach(a => a.classList.remove('active'));
        const el = byId[id];
        if (!el) return;
        el.classList.add('active');
        if (sb) {
          const top = el.offsetTop, bottom = top + el.offsetHeight;
          if (top < sb.scrollTop + 32 || bottom > sb.scrollTop + sb.clientHeight - 32)
            sb.scrollTop = top - sb.clientHeight / 2 + el.offsetHeight / 2;
        }
      };
      let ticking = false;
      const onScrollTOC = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          if (!heads.length) return;
          const line = 110;                 /* 视口顶部偏移阈值 */
          let cur = heads[0].id;
          for (const h of heads) {
            if (h.getBoundingClientRect().top - line <= 0) cur = h.id;
            else break;
          }
          /* 滚到最底部时，强制选中最后一节 */
          if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4)
            cur = heads[heads.length - 1].id;
          setActive(cur);
        });
      };
      addEventListener('scroll', onScrollTOC, { passive: true });
      onScrollTOC();

      /* 第 0 章的目录表 -> 章节卡片 */
      const ch0 = $('#ch0');
      if (ch0) {
        let el = ch0.nextElementSibling, table = null;
        while (el) { if (el.tagName === 'TABLE') { table = el; break; } el = el.nextElementSibling; }
        if (table) {
          const anchorOf = t => {
            const m = t.match(/第\s*(\d+)\s*章/);
            if (m) return 'ch' + m[1];
            if (t.includes('附录 A')) return 'appA';
            if (t.includes('附录 B')) return 'appB';
            return 'ch0';
          };
          const cards = document.createElement('div');
          cards.className = 'toc-cards';
          Array.from(table.querySelectorAll('tbody tr')).forEach(tr => {
            const tds = tr.querySelectorAll('td');
            if (tds.length < 3) return;
            const a = document.createElement('a');
            a.className = 'toc-card';
            a.href = '#' + anchorOf(tds[0].textContent);
            a.innerHTML =
              '<div class="no"></div><div class="tt"></div><div class="desc"></div>';
            a.querySelector('.no').textContent = tds[0].textContent.trim();
            a.querySelector('.tt').textContent = tds[1].textContent.trim();
            a.querySelector('.desc').textContent = tds[2].textContent.trim();
            cards.appendChild(a);
          });
          table.replaceWith(cards);
        }
      }

      /* 重点提示框图标 */
      doc.querySelectorAll('blockquote').forEach(bq => {
        const t = bq.textContent;
        let ic = '📌';
        if (/红线|免责|务必|注意|默认不行|必做|必须/.test(t)) ic = '⚠️';
        else if (/类比|经验法则|为什么|编排逻辑|用法|一页速记/.test(t)) ic = '💡';
        bq.dataset.icon = ic;
      });

      /* 代码块复制按钮 */
      doc.querySelectorAll('pre').forEach(pre => {
        const btn = document.createElement('button');
        btn.className = 'copybtn';
        btn.textContent = '复制';
        btn.onclick = async () => {
          const code = pre.querySelector('code');
          const txt = code ? code.textContent : pre.textContent;
          try {
            await navigator.clipboard.writeText(txt);
            btn.textContent = '已复制 ✓';
            setTimeout(() => btn.textContent = '复制', 1500);
          } catch (e) { btn.textContent = '复制失败'; }
        };
        pre.appendChild(btn);
      });

      /* ===== 批注引擎 =====
         在正文中搜索 anchor 短语，用 <span class="anno"> 包住，
         悬停/长按时显示 .anno-pop 卡片（fixed 定位到角标旁）。 */
      const pop = $('#annoPop');
      let usedIdx = [];
      ANNOS.forEach((anno, i) => {
        const found = wrapFirstMatch(doc, anno.anchor);
        if (found) {
          found.dataset.annoI = i + 1;
          found.dataset.annoKey = i;
          usedIdx.push(i);
        } else {
          console.warn('anno anchor not found:', anno.anchor);
        }
      });
      function wrapFirstMatch(root, anchor) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(n) {
            if (!n.nodeValue.includes(anchor)) return NodeFilter.FILTER_REJECT;
            if (n.parentElement.closest('pre,script,.anno')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        let node;
        while ((node = walker.nextNode())) {
          const idx = node.nodeValue.indexOf(anchor);
          const textNode = node;
          const span = document.createElement('span');
          span.className = 'anno';
          const before = textNode.nodeValue.slice(0, idx);
          const after = textNode.nodeValue.slice(idx + anchor.length);
          const parent = textNode.parentNode;
          if (before) parent.insertBefore(document.createTextNode(before), textNode);
          span.textContent = anchor;
          parent.insertBefore(span, textNode);
          if (after) parent.insertBefore(document.createTextNode(after), textNode);
          parent.removeChild(textNode);
          return span;
        }
        return null;
      }
      doc.querySelectorAll('.anno').forEach(sp => {
        const show = () => {
          const a = ANNOS[+sp.dataset.annoKey];
          pop.innerHTML = '<span class="ttl">' + a.title + '</span>' + a.html;
          pop.style.display = 'block';
          const r = sp.getBoundingClientRect();
          const vw = innerWidth, vh = innerHeight;
          const pw = pop.offsetWidth, ph = pop.offsetHeight;
          let top = r.bottom + 8, left = Math.max(12, Math.min(r.left, vw - pw - 12));
          if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 8);
          pop.style.top = top + 'px';
          pop.style.left = left + 'px';
        };
        const hide = () => { pop.style.display = 'none'; };
        sp.addEventListener('mouseenter', show);
        sp.addEventListener('mouseleave', hide);
        sp.addEventListener('focus', show); sp.addEventListener('blur', hide);
        sp.tabIndex = 0;
        /* 触屏：点一下显示，再点一下关闭 */
        sp.addEventListener('click', e => {
          e.preventDefault();
          pop.style.display === 'block' ? hide() : show();
        });
        addEventListener('scroll', hide, { passive: true });
      });

      /* 阅读进度条 */
      const bar = $('#progress');
      addEventListener('scroll', () => {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0).toFixed(1) + '%';
      }, { passive: true });
    } catch (e) {
      $('#loading').remove();
      const err = $('#err');
      err.style.display = 'block';
      err.innerHTML = '<p>加载 index.md 失败：' + e +
        '</p><p>请确认 index.md 与 index.html 在同一目录（仓库根目录）。</p>';
    }
  })();
  </script>
</body>
</html>
