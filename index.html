<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Handbook</title>
  <style>
    :root {
      --bg:#ffffff; --fg:#1a1a1a; --muted:#66707a; --border:#e3e6ea; --card:#f6f8fa;
      --accent:#1d4ed8; --accent-soft:#eef4ff; --code-bg:#0d1117; --code-fg:#e6edf3;
      --topbar-bg:rgba(255,255,255,.92);
      --p0:#64748b; --p1:#1d4ed8; --p2:#0f766e; --p3:#7c3aed; --p4:#b45309;
    }
    [data-theme="dark"] {
      --bg:#0f1115; --fg:#d7dbe0; --muted:#8b94a0; --border:#262c35; --card:#171b22;
      --accent:#7aa2ff; --accent-soft:#1a2436; --code-bg:#0a0c10; --code-fg:#d6deeb;
      --topbar-bg:rgba(15,17,21,.9);
      --p0:#8494ab; --p1:#7aa2ff; --p2:#4fd1c5; --p3:#a78bfa; --p4:#f59e0b;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      line-height:1.75; font-size:15.5px; }
    h1 { border-bottom:2px solid var(--fg); padding-bottom:.4rem; line-height:1.35; }
    h2 { border-bottom:1px solid var(--border); padding-bottom:.45rem; margin-top:2.4rem; scroll-margin-top:70px;
      border-left:none; }
    h2[data-part] { padding-left:.7rem; border-left:4px solid var(--pc);
      background:linear-gradient(90deg, color-mix(in srgb, var(--pc) 7%, transparent), transparent 65%);
      border-radius:0 8px 8px 0; }
    h2 .h2-en { display:block; font-size:.6em; font-weight:500; color:var(--muted); letter-spacing:.1em;
      margin-top:.2rem; font-family:"Cascadia Code",Consolas,"SF Mono",monospace; }
    h3 { margin-top:1.8rem; scroll-margin-top:70px; padding-left:.5rem; border-left:2px solid var(--border); }
    h4 { margin-top:1.4rem; scroll-margin-top:70px; }
    h4::before { content:"◈ "; color:var(--accent); font-size:.85em; }
    a { color:var(--accent); }
    code { background:var(--card); border:1px solid var(--border); padding:2px 5px; border-radius:5px;
      font-family:"Cascadia Code",Consolas,"SF Mono",monospace; font-size:.88em; }
    pre { background:var(--code-bg); color:var(--code-fg); padding:14px 16px; border-radius:10px;
      overflow:auto; line-height:1.55; position:relative; }
    pre code { background:none; border:none; padding:0; color:inherit; }
    .langlab { position:absolute; top:8px; left:12px; font-size:.7rem; color:#9aa4b2;
      font-family:Consolas,monospace; letter-spacing:.03em; }
    table { border-collapse:separate; border-spacing:0; width:100%; margin:1.1rem 0; font-size:.93em;
      border:1px solid var(--border); border-radius:10px; overflow:hidden; }
    th, td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
    th { background:var(--card); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    blockquote { border-left:4px solid var(--accent); background:var(--accent-soft);
      margin:1.1rem 0; padding:.55rem 1rem; border-radius:0 10px 10px 0; position:relative; }
    blockquote p { margin:.35rem 0; }
    blockquote::before { content:attr(data-icon); margin-right:.45rem; }
    .callout-lab { position:absolute; top:.4rem; right:.6rem; font-size:.68rem; font-weight:600;
      color:var(--accent); background:var(--bg); border:1px solid var(--border);
      padding:1px 8px; border-radius:99px; opacity:.85; letter-spacing:.05em; }
    hr { border:none; border-top:1px solid var(--border); margin:2.2rem 0; }
    /* ===== Part 视觉架构 ===== */
    .part-header { margin:3.2rem 0 .9rem; padding:.5rem .85rem; border-radius:8px;
      font-size:.88rem; font-weight:700; letter-spacing:.02em; color:var(--fg);
      border-left:4px solid var(--pc); background:color-mix(in srgb, var(--pc) 9%, transparent); }
    .part-header .ph-part { color:var(--pc); margin-right:.6rem; font-weight:800; }
    .part-header .ph-sub { font-weight:400; color:var(--muted); font-size:.82em; margin-left:.6rem; }
    .part-header.ph-first { margin-top:1rem; }
    .part-header.ph-ref { background:none; border-left:none; border-top:1px solid var(--border);
      padding-top:.9rem; border-radius:0; }
    .ch-card[data-part] { border-left:3px solid var(--pc); }
    /* ===== Part 主题色 ===== */
    [data-part="p0"] { --pc:var(--p0); } [data-part="p1"] { --pc:var(--p1); }
    [data-part="p2"] { --pc:var(--p2); } [data-part="p3"] { --pc:var(--p3); }
    [data-part="p4"] { --pc:var(--p4); }
    h3[data-part] { border-left-color:var(--pc); }
    h3[data-part] .h3-en { color:var(--pc); }
    .toc-sec[data-part] > a.lv1 { color:var(--pc); }
    .toc-sec[data-part] > a.lv1:hover { color:var(--pc); }
    .toc-sec[data-part] > a.lv1.active { color:var(--pc); border-left-color:var(--pc);
      background:color-mix(in srgb, var(--pc) 14%, transparent); }
    /* ===== 进度条 / 顶栏 ===== */
    .progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; z-index:60; }
    .topbar { position:sticky; top:0; background:var(--topbar-bg); backdrop-filter:blur(6px);
      z-index:50; border-bottom:1px solid var(--border); }
    .topbar .row { max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:.8rem;
      padding:.5rem 1rem; flex-wrap:wrap; }
    .brand { font-weight:700; white-space:nowrap; }
    .chips { display:flex; gap:.4rem; flex-wrap:wrap; flex:1; align-items:center; }
    .chips a { font-size:.8rem; text-decoration:none; padding:3px 9px; border-radius:6px;
      background:var(--card); color:var(--fg); border:1px solid var(--border); }
    .chips a:hover { border-color:var(--accent); color:var(--accent); }
    .chips a.pd { border-left:2px solid var(--muted); }
    .chips .chip-sep { font-size:.66rem; color:var(--muted); letter-spacing:.06em; margin:0 .2rem .1rem; }
    #themeBtn { border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
    #navBtn { display:none; border:1px solid var(--border); background:var(--card); color:var(--fg);
      border-radius:6px; padding:3px 9px; cursor:pointer; font-size:.85rem; }
    /* ===== 布局 ===== */
    .layout { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:270px minmax(0,1fr);
      gap:2rem; padding:1.5rem 1rem 4rem; align-items:start; }
    .doc { min-width:0; }
    .sidebar { position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto;
      font-size:12.5px; border-right:1px solid var(--border); padding-right:1rem; }
    .side-title { font-weight:700; margin:.4rem 0 .6rem; color:var(--muted); letter-spacing:.05em; }
    /* 当前所在指示器 */
    .cur-pill { font-size:.75rem; background:var(--accent-soft); color:var(--accent);
      padding:.45rem .6rem; border-radius:8px; margin-bottom:.6rem; line-height:1.5; }
    .cur-pill b { display:block; font-size:.85rem; }
    .cur-pill span { color:var(--muted); font-weight:400; }
    .toc a { display:block; color:var(--muted); text-decoration:none; padding:2px 8px;
      border-left:2px solid transparent; border-radius:0 6px 6px 0; }
    .toc a:hover { color:var(--accent); }
    .toc a.active { color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); font-weight:600; }
    .toc-part { font-size:.68rem; font-weight:700; letter-spacing:.05em; color:var(--pc);
      margin:.8rem 0 .2rem .2rem; opacity:.9; }
    .toc-part::before { content:""; display:inline-block; width:8px; height:8px; border-radius:2px;
      background:var(--pc); margin-right:.4rem; vertical-align:baseline; }
    .toc-sec { margin-top:3px; }
    .toc .lv1 { font-weight:600; cursor:pointer; }
    .toc .lv1::after { content:"▸"; float:right; font-size:10px; color:var(--muted); margin-left:auto; }
    .toc-sec.open .lv1::after { content:"▾"; }
    .toc-sec.empty .lv1::after { content:""; }
    .toc-sub { display:none; margin-top:2px; }
    .toc-sec.open > .toc-sub { display:block; }
    .toc .lv2 { display:block; padding-left:20px; font-size:11.5px; }
    .toc .lv3 { display:block; padding-left:38px; font-size:11px; }
    .toc-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.7rem; margin:1rem 0; }
    .toc-part-label { grid-column:1/-1; font-size:.78rem; font-weight:700; color:var(--pc);
      letter-spacing:.04em; margin-top:.45rem; padding-left:.15rem; }
    .toc-part-label::before { content:""; display:inline-block; width:9px; height:9px; border-radius:2px;
      background:var(--pc); margin-right:.45rem; }
    .toc-card { display:block; text-decoration:none; color:var(--fg); background:var(--card);
      border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; transition:.15s; }
    .toc-card:hover { border-color:var(--accent); transform:translateY(-2px);
      box-shadow:0 3px 10px rgba(0,0,0,.07); }
    .toc-card .no { font-size:.72rem; font-weight:700; color:var(--pc, var(--accent)); letter-spacing:.04em; }
    .toc-card .tt { font-weight:700; margin:.15rem 0 .2rem; font-size:.95rem; }
    .toc-card .desc { font-size:.8rem; color:var(--muted); line-height:1.5; }
    .copybtn { position:absolute; top:8px; right:8px; font-size:.72rem; color:#9aa4b2;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
      padding:2px 9px; border-radius:6px; cursor:pointer; opacity:0; transition:.15s; }
    pre:hover .copybtn { opacity:1; }
    .backtop { display:inline-block; margin-top:1rem; font-size:.8rem; color:var(--muted); text-decoration:none; }
    /* ===== 批注角标 ===== */
    .anno { position:relative; cursor:help; }
    .anno::after { content:"①"; }
    .anno[data-anno-i="2"]::after { content:"②"; }
    .anno[data-anno-i="3"]::after { content:"③"; }
    .anno[data-anno-i="4"]::after { content:"④"; }
    .anno[data-anno-i="5"]::after { content:"⑤"; }
    .anno[data-anno-i="6"]::after { content:"⑥"; }
    .anno[data-anno-i="7"]::after { content:"⑦"; }
    .anno[data-anno-i="8"]::after { content:"⑧"; }
    .anno[data-anno-i="9"]::after { content:"⑨"; }
    .anno[data-anno-i="10"]::after { content:"⑩"; }
    .anno::after { position:absolute; top:-1.15em; left:0; margin-left:-1.25em;
      font-size:.78em; color:var(--accent); font-weight:700; }
    .anno::before { content:""; position:absolute; inset:-4px -6px; border-radius:6px; transition:.15s; }
    .anno:hover::before { background:var(--accent-soft); }
    .anno-pop { position:fixed; z-index:100; max-width:420px; display:none;
      background:var(--card); color:var(--fg); border:1px solid var(--accent);
      border-radius:10px; padding:.8rem 1rem; font-size:.9rem; line-height:1.65;
      box-shadow:0 8px 24px rgba(0,0,0,.18); }
    .anno-pop .ttl { font-weight:700; color:var(--accent); display:block; margin-bottom:.3rem; }
    .anno-pop ul { margin:.35rem 0 0; padding-left:1.2rem; }
    /* ===== 邀请码门 ===== */
    .invite-gate { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
      background:var(--bg); padding:1rem; }
    .invite-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:1.5rem 1.6rem; width:min(360px,92vw); box-shadow:0 12px 40px rgba(0,0,0,.15); }
    .invite-brand { font-weight:700; font-size:1.05rem; margin-bottom:.4rem; }
    .invite-hint { color:var(--muted); font-size:.9rem; line-height:1.6; margin-bottom:1rem; }
    #inviteForm { display:flex; gap:.5rem; }
    #inviteInput { flex:1; min-width:0; padding:.5rem .7rem; border:1px solid var(--border); border-radius:8px;
      background:var(--bg); color:var(--fg); font-size:.95rem; }
    #inviteInput:focus { outline:none; border-color:var(--accent); }
    #inviteBtn { padding:.5rem 1rem; border:1px solid var(--accent); background:var(--accent); color:#fff;
      border-radius:8px; cursor:pointer; font-size:.9rem; white-space:nowrap; }
    #inviteBtn:disabled { opacity:.5; cursor:wait; }
    .invite-err { color:#c0392b; font-size:.85rem; margin-top:.6rem; }
    .invite-note { color:var(--muted); font-size:.78rem; margin-top:1rem; }
    /* ===== 移动端目录抽屉 ===== */
    #scrim { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; }
    @media (max-width:1000px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:45; width:285px; max-width:84vw;
        background:var(--bg); max-height:none; border-right:1px solid var(--border);
        padding:1rem; margin:0; transform:translateX(-105%); transition:transform .25s ease; }
      .sidebar.open { transform:none; box-shadow:8px 0 30px rgba(0,0,0,.15); }
      #navBtn { display:inline-block; }
      body.nav-open #scrim { display:block; }
      .chips .chip-sep { display:none; }
    }
    /* ===== Reading-first layout refresh ===== */
    :root { --bg:#f4f6f8; --surface:#fff; --surface-2:#f8fafc; --fg:#17202b; --muted:#667384; --faint:#8c98a6; --border:#e3e8ee; --accent:#3159d8; --accent-soft:#eef2ff; --shadow:0 14px 42px rgba(30,45,65,.08); }
    [data-theme="dark"] { --bg:#0e131b; --surface:#151c26; --surface-2:#1a2330; --fg:#e7edf5; --muted:#9aa7b6; --faint:#718094; --border:#293545; --accent:#8ca8ff; --accent-soft:#202c49; --shadow:0 16px 45px rgba(0,0,0,.22); }
    body { background:var(--bg); color:var(--fg); font-size:15.5px; }
    .topbar { background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(14px); }
    .topbar .row { max-width:1380px; min-height:64px; padding:10px 24px; gap:16px; }
    .brand { display:flex; align-items:center; gap:10px; letter-spacing:-.02em; }
    .brand::first-letter { color:var(--accent); }
    .chips { gap:6px; overflow:auto; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chips a { padding:6px 10px; border-radius:8px; color:var(--muted); }
    .chips a:hover,.chips a.pd { color:var(--accent); background:var(--accent-soft); }
    .layout { max-width:1380px; padding:30px 24px 80px; grid-template-columns:252px minmax(0,820px); gap:42px; }
    .sidebar { top:88px; max-height:calc(100vh - 112px); padding-right:18px; }
    .side-title { font-size:18px; letter-spacing:-.02em; }
    .side-title::before { content:"Reading map"; display:block; margin-bottom:9px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .cur-pill { padding:11px 12px; border-radius:12px; font-size:11px; }
    .toc-part { margin:20px 0 6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .toc a { padding:5px 9px; border-radius:0 8px 8px 0; font-size:12px; line-height:1.45; }
    .toc .lv1 { color:var(--fg); font-weight:650; }
    .toc a:hover { background:var(--surface-2); }
    .doc { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:42px 58px 76px; }
    .doc #doc > h1 { margin-top:0; padding-bottom:24px; border-bottom:1px solid var(--border); font-size:clamp(2rem,4vw,3.1rem); line-height:1.15; letter-spacing:-.05em; }
    .doc #doc > h1 + p { color:var(--muted); font-size:17px; }
    h2 { margin:70px 0 19px; padding:16px 18px 13px; border:1px solid color-mix(in srgb,var(--pc) 22%,var(--border)); border-left:5px solid var(--pc); border-radius:12px; background:linear-gradient(100deg,color-mix(in srgb,var(--pc) 8%,transparent),transparent 70%); }
    h2:first-of-type { margin-top:36px; }
    h2 .h2-en { margin-top:5px; color:var(--pc); font-size:10px; }
    h3 { margin-top:40px; padding-left:12px; border-left:3px solid var(--pc); }
    h4 { margin-top:28px; }
    p { margin:12px 0; } li+li { margin-top:5px; }
    .part-header { margin:42px 0 -34px; padding:0; color:var(--muted); background:none; border:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    .part-header .ph-part { color:var(--pc); }
    blockquote { padding:12px 17px; border-radius:0 12px 12px 0; }
    pre { padding:18px 20px; border-radius:12px; }
    table { border-radius:12px; }
    .toc-cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .toc-card { padding:15px 16px; border-radius:11px; background:var(--surface-2); }
    .toc-card:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(30,45,65,.08); }
    @media (max-width:1050px) { .topbar .row { padding-inline:16px; } .chips { display:none; } .layout { grid-template-columns:1fr; padding:20px 16px 50px; } .sidebar { top:0; width:min(310px,88vw); max-height:none; padding:25px 20px; background:var(--surface); transform:translateX(-105%); } .doc { padding:30px 25px 55px; } }
    @media (max-width:620px) { .doc { border-radius:14px; padding:25px 18px 45px; } .doc #doc > h1 { font-size:2rem; } h2 { margin-top:50px; padding:13px; } .toc-cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar" id="top">
    <div class="row">
      <button id="navBtn" title="目录">☰</button>
      <span class="brand">📗 AI Handbook</span>
      <nav class="chips">
        <a href="#ch0">目录</a>
        <span class="chip-sep">① 原理·选型</span><a href="#ch1" class="pd">核心概念</a><a href="#ch2">平台</a>
        <span class="chip-sep">② 红线·技能</span><a href="#ch3" class="pd">安全合规</a><a href="#ch4">Skill</a><a href="#ch5">Skill实例</a>
        <span class="chip-sep">③ 工程化</span><a href="#ch6" class="pd">Git</a><a href="#ch7">Cloudflare</a>
        <span class="chip-sep">参考</span><a href="#ch8" class="pd">FAQ</a><a href="#ch9">术语表</a><a href="#appA">模板库</a>
      </nav>
      <button id="themeBtn" title="切换明暗模式">🌙</button>
    </div>
  </header>
  <div id="scrim"></div>
  <div class="layout">
    <aside class="sidebar" id="side">
      <div class="side-title">目录导航</div>
      <div id="curPill" class="cur-pill" style="display:none"></div>
      <nav id="toc" class="toc"></nav>
      <a class="backtop" href="#top">↑ 回到顶部</a>
    </aside>
    <div class="doc">
      <div id="loading" style="color:var(--muted)">正在加载…</div>
      <div id="err" style="display:none;color:#c0392b"></div>
      <div id="doc" style="display:none"></div>
    </div>
  </div>
  <div class="anno-pop" id="annoPop"></div>

  <!-- 邀请码门：默认隐藏，JS 校验通过前覆盖全屏 -->
  <div class="invite-gate" id="gate" style="display:none" role="dialog" aria-modal="true">
    <div class="invite-card">
      <div class="invite-brand">📗 AI Handbook · 邀请访问</div>
      <p class="invite-hint">这是一份私人学习笔记站点，请输入邀请码进入。</p>
      <form id="inviteForm">
        <input id="inviteInput" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="邀请码">
        <button id="inviteBtn" type="submit">进入</button>
      </form>
      <div class="invite-err" id="inviteErr"></div>
      <p class="invite-note">同一浏览器 24 小时内无需重复输入；邀请码区分大小写。</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  /* ========= 批注定义（以后要加批注，只改这个数组） =========
     anchor: 正文里出现过的短语（首次出现处插角标）
     title / html: 悬浮显示内容（html 可用 <ul>/<b> 等简单标签）
     注意：anchor 必须与 index.md 中的文字完全一致，写错了不会报错，只是不显示。 */
  const ANNOS = [
    {
      anchor: '请输出 JSON，字段为',
      title: '💡 批注：这个 JSON 示例好在哪',
      html: `
        <b>核心优势</b>：把 AI 输出从"给人看的段落"变成"给程序用的数据"。
        <ul>
          <li><b>机器可读</b>：输出可直接 <code>json.loads()</code> → <code>DataFrame</code> → Excel，"AI 提取 → 汇总 50 家 → 出对比表"全自动</li>
          <li><b>口径统一</b>：字段固定 = 每家都是同样 5 列，批量结果能逐列横向比较</li>
          <li><b>缺失显式</b>：约定"缺失填 null"，能区分"值为 0"和"未披露"——尽调/审计关键</li>

  /* ============================================================ */

  /* ========= 展示结构（纯呈现层：Part 分组 / 章节编号 / 英文名） =========
     只影响排版，不改写 index.md 的任何内容文字。 */
  const PARTS = [
    { cls:'p1', text:'①', name:'原理与选型', sub:'第 1–2 章',   ids:['ch1','ch2'] },
    { cls:'p2', text:'②', name:'红线与技能', sub:'第 3–5 章',   ids:['ch3','ch4','ch5'] },
    { cls:'p3', text:'③', name:'工程化支撑', sub:'第 6–7 章',   ids:['ch6','ch7'] },
    { cls:'p4', text:'参考与速查', name:'', sub:'第 8–9 章 + 附录', ids:['ch8','ch9','appA','appB'] }
  ];
  const EN = {
    ch0:'OVERVIEW & QUICK START', ch1:'CORE CONCEPTS', ch2:'PLATFORMS', ch3:'SAFETY & COMPLIANCE',
    ch4:'SKILLS', ch5:'SKILL IN PRACTICE', ch6:'GIT & GITHUB', ch7:'CLOUDFLARE',
    ch8:'FAQ', ch9:'GLOSSARY', appA:'PROMPT TEMPLATES', appB:'TOOLS & ROADMAP'
  };

  (async () => {
    const $ = s => document.querySelector(s);

    /* 明暗模式 */
    const root = document.documentElement;
    let theme = localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const applyTheme = t => { theme = t; root.setAttribute('data-theme', t);
      $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; };
    applyTheme(theme);
    $('#themeBtn').onclick = () => { applyTheme(theme === 'dark' ? 'light' : 'dark');
      localStorage.setItem('theme', theme); };

    /* 移动端目录抽屉 */
    const side = $('#side');
    const closeDrawer = () => { side.classList.remove('open'); document.body.classList.remove('nav-open'); };
    $('#navBtn').onclick = () => {
      const open = side.classList.toggle('open');
      document.body.classList.toggle('nav-open', open);
    };
    $('#scrim').onclick = closeDrawer;

    async function loadContent() {
    try {
      const res = await fetch('index.md', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      const doc = $('#doc');
      doc.innerHTML = marked.parse(md, { gfm: true, breaks: false });
      $('#loading').remove();
      doc.style.display = 'block';

      /* 锚点：h2 -> ch0..ch9, appA, appB；h3 -> s0..；h4 -> h0..（h4 仅用于定位） */
      doc.querySelectorAll('h2').forEach((h, i) => {
        h.id = i <= 9 ? 'ch' + i : (i === 10 ? 'appA' : 'appB');
      });
      doc.querySelectorAll('h3').forEach((h, i) => { h.id = 's' + i; });
      doc.querySelectorAll('h4').forEach((h, i) => { h.id = 'h' + i; });
      /* 记录原标题文字（后续会往标题里插编号徽章/英文名，目录与指示器须用原文） */
      doc.querySelectorAll('h2, h3').forEach(h => { h.dataset.orig = h.textContent; });

      /* ===== Part 分组标记（呈现层，不改内容文字） ===== */
      const partOf = {};
      PARTS.forEach(p => p.ids.forEach(id => partOf[id] = p));
      const chH2s = {};
      doc.querySelectorAll('h2').forEach(h => chH2s[h.id] = h);

      /* ch0：目录章（p0 中性色，不加 part 横幅） */
      if (chH2s.ch0) chH2s.ch0.closest('h2') && chH2s.ch0.setAttribute('data-part','p0');
      /* 正文中的 part 横幅：插在对应章节 h2 之前 */
      PARTS.forEach((p, pi) => {
        const first = document.getElementById(p.ids[0]);
        if (!first) return;
        const div = document.createElement('div');
        div.className = 'part-header' + (p.cls === 'p4' ? ' ph-ref' : (pi === 0 ? '' : ''));
        div.setAttribute('data-part', p.cls);
        div.innerHTML = (p.text ? '<span class="ph-part">' + p.text + '</span>' : '')
          + '<span class="ph-name">' + (p.name || p.sub) + '</span>'
          + (p.name ? '<span class="ph-sub">' + p.sub + '</span>' : '');
        first.parentNode.insertBefore(div, first);
      });

      /* ===== 章节标题：Part 主题色 + 英文名（不改动内容文字） =====
         h2/h3 自带"第 N 章"/"N.N"编号，不再注入重复编号；
         仅加 data-part（决定色条/目录配色）与 h2 英文小字副题。 */
      doc.querySelectorAll('h2').forEach(h => {
        h.setAttribute('data-part', (partOf[h.id] || { cls: 'p0' }).cls);
        if (EN[h.id]) h.insertAdjacentHTML('beforeend',
          '<span class="h2-en">' + EN[h.id] + '</span>');
      });
      /* 顺序遍历：每个 h3 取它前面最近 h2 的 part */
      {
        let curPart = 'p0';
        doc.querySelectorAll('h2, h3').forEach(h => {
          if (h.tagName === 'H2') curPart = (partOf[h.id] || { cls: 'p0' }).cls;
          else h.setAttribute('data-part', curPart);
        });
      }

      /* ===== 侧边目录（Part 标签 + 可折叠章节 + 小节三级） ===== */
      const toc = $('#toc');
      const heads = [];                       // scrollspy 用：h2 + h3（h4 不进 spy）
      const origText = {};                    // 标题 id -> 原始文字（供目录/指示器用）
      doc.querySelectorAll('h2[id], h3[id]').forEach(h => { heads.push(h); origText[h.id] = h.dataset.orig || h.textContent; });
      const aMap = {};
      let curLv1 = null, lastPart = null;
      doc.querySelectorAll('h2[id], h3[id]').forEach(h => {
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = origText[h.id];
        aMap[h.id] = a;
        if (h.tagName === 'H2') {
          const p = partOf[h.id];
          const pc = p ? p.cls : 'p0';
          if (pc !== lastPart) {
            lastPart = pc;
            const ph = document.createElement('div');
            ph.className = 'toc-part';
            ph.setAttribute('data-part', pc);
            ph.textContent = pc === 'p0' ? '总览'
              : (pc === 'p4' ? '参考与速查'
                : (pc === 'p1' ? '① 原理与选型' : (pc === 'p2' ? '② 红线与技能' : '③ 工程化支撑')));
            toc.appendChild(ph);
          }
          const sec = document.createElement('div');
          sec.className = 'toc-sec';
          sec.setAttribute('data-part', pc);
          a.className = 'lv1';
          sec.appendChild(a);
          const sub = document.createElement('div');
          sub.className = 'toc-sub';
          sec.appendChild(sub);
          toc.appendChild(sec);
          curLv1 = { sec, sub, hasSub: false };
        } else {
          a.className = 'lv2';
          if (curLv1) { curLv1.sub.appendChild(a); curLv1.hasSub = true; }
          else toc.appendChild(a);
        }
      });
      toc.querySelectorAll('.toc-sec').forEach(sec => {
        if (!sec.querySelector('.lv2')) sec.classList.add('empty');
      });
      const secs = Array.from(toc.querySelectorAll('.toc-sec'));
      if (secs[0]) secs[0].classList.add('open');   /* 默认展开第一章 */

      /* 点击定位：章节/小节均平滑滚动，并自动展开对应章节的小节；锁定期间滚动跟随不抢高亮 */
      let followLockUntil = 0;
      const lockFollow = ms => { followLockUntil = performance.now() + ms; };
      const sb = document.querySelector('.sidebar');
      const curPill = $('#curPill');
      const setActive = id => {
        toc.querySelectorAll('a.active').forEach(a => a.classList.remove('active'));
        const el = aMap[id];
        if (!el) return;
        el.classList.add('active');
        const sec = el.closest('.toc-sec');
        if (sec && !sec.classList.contains('open')) sec.classList.add('open');
        if (sb) {
          const top = el.offsetTop, bottom = top + el.offsetHeight;
          if (top < sb.scrollTop + 32 || bottom > sb.scrollTop + sb.clientHeight - 32)
            sb.scrollTop = top - sb.clientHeight / 2 + el.offsetHeight / 2;
        }
        /* 当前所在指示器 */
        let chText = '', secText = '';
        if (el.classList.contains('lv1')) chText = origText[el.href.slice(1)];
        else {
          const p = el.closest('.toc-sec');
          if (p) chText = origText[p.querySelector('a.lv1').href.slice(1)];
          secText = origText[el.href.slice(1)];
        }
        const pc = (sec && sec.getAttribute('data-part')) || 'p0';
        curPill.style.setProperty('--pc', 'var(--' + pc + ')');
        curPill.innerHTML = '<span>当前所在</span><b style="color:var(--' + pc + ')">' +
          (secText ? chText + ' · ' + secText : chText) + '</b>';
        curPill.style.display = 'block';
      };
      const gotoHeading = (id, secEl) => {
        if (secEl && !secEl.classList.contains('open')) secEl.classList.add('open');
        const t = document.getElementById(id);
        if (!t) return;
        lockFollow(900);
        t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActive(id);
        history.replaceState(null, '', '#' + id);
        closeDrawer();
      };
      toc.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          gotoHeading(a.href.slice(1), a.closest('.toc-sec'));
        });
      });
      /* 顶栏导航：同样平滑定位 + 高亮 + 展开对应章节 */
      document.querySelectorAll('.chips a').forEach(a => {
        a.addEventListener('click', e => {
          const m = a.getAttribute('href') && a.getAttribute('href').match(/^#([a-z0-9]+)$/i);
          if (!m || !document.getElementById(m[1])) return;
          e.preventDefault();
          gotoHeading(m[1], aMap[m[1]] ? aMap[m[1]].closest('.toc-sec') : null);
        });
      });
      /* 章节卡片是后生成的，用事件委托 */
      document.addEventListener('click', e => {
        const card = e.target.closest('.toc-card');
        if (!card) return;
        const m = card.getAttribute('href') && card.getAttribute('href').match(/^#([a-z0-9]+)$/i);
        if (!m || !document.getElementById(m[1])) return;
        e.preventDefault();
        gotoHeading(m[1], aMap[m[1]] ? aMap[m[1]].closest('.toc-sec') : null);
      }, true);

      let ticking = false;
      const onScrollTOC = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          ticking = false;
          if (performance.now() < followLockUntil) return;
          if (!heads.length) return;
          const line = 110;
          let cur = heads[0].id;
          for (const h of heads) {
            if (h.getBoundingClientRect().top - line <= 0) cur = h.id;
            else break;
          }
          if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4)
            cur = heads[heads.length - 1].id;
          setActive(cur);
        });
      };
      addEventListener('scroll', onScrollTOC, { passive: true });
      onScrollTOC();

      /* 第 0 章：目录表保留作"总览"，其下追加按 Part 分组的章节卡片 */
      const ch0 = $('#ch0');
      if (ch0) {
        let el = ch0.nextElementSibling, table = null;
        while (el) { if (el.tagName === 'TABLE') { table = el; break; } el = el.nextElementSibling; }
        if (table) {
          const anchorOf = t => {
            const m = t.match(/第\s*(\d+)\s*章/);
            if (m) return 'ch' + m[1];
            if (t.includes('附录 A')) return 'appA';
            if (t.includes('附录 B')) return 'appB';
            return 'ch0';
          };
          const rows = Array.from(table.querySelectorAll('tbody tr')).map(tr => {
            const tds = tr.querySelectorAll('td');
            if (tds.length < 3) return null;
            return { id: anchorOf(tds[0].textContent),
              no: tds[0].textContent.trim(), tt: tds[1].textContent.trim(), desc: tds[2].textContent.trim() };
          }).filter(Boolean);
          /* 总览表下方保留，卡片网格按 Part 插入其后 */
          const wrap = document.createElement('div');
          wrap.className = 'ch0-cards';
          const groupOf = id => {
            for (const p of PARTS) if (p.ids.includes(id)) return p;
            return { cls:'p0', name:'总览', sub:'' };
          };
          const shown = new Set();
          PARTS.forEach(p => {
            const g = rows.filter(r => p.ids.includes(r.id));
            if (!g.length) return;
            shown.add(p.cls);
            const lab = document.createElement('div');
            lab.className = 'toc-part-label';
            lab.setAttribute('data-part', p.cls);
            lab.textContent = p.name ? p.text + ' ' + p.name : p.sub;
            wrap.appendChild(lab);
            const grid = document.createElement('div');
            grid.className = 'toc-cards';
            g.forEach(r => {
              const a = document.createElement('a');
              a.className = 'ch-card toc-card';
              a.setAttribute('data-part', p.cls);
              a.href = '#' + r.id;
              a.innerHTML = '<div class="no"></div><div class="tt"></div><div class="desc"></div>';
              a.querySelector('.no').textContent = r.no;
              a.querySelector('.tt').textContent = r.tt;
              a.querySelector('.desc').textContent = r.desc;
              grid.appendChild(a);
            });
            wrap.appendChild(grid);
          });
          /* 总览（ch0 自身无卡片） */
          const lab0 = document.createElement('div');
          lab0.className = 'toc-part-label';
          lab0.setAttribute('data-part','p0');
          lab0.textContent = '总览';
          wrap.appendChild(lab0);
          const grid0 = document.createElement('div');
          grid0.className = 'toc-cards';
          const a0 = document.createElement('a');
          a0.className = 'ch-card toc-card';
          a0.setAttribute('data-part','p0');
          a0.href = '#ch0';
          a0.innerHTML = '<div class="no">第 0 章</div><div class="tt">目录与快速上手</div>' +
            '<div class="desc">编排逻辑 · 章节总览 · 从这里开始</div>';
          grid0.appendChild(a0);
          wrap.appendChild(grid0);
          table.insertAdjacentElement('afterend', wrap);
        }
      }

      /* 重点提示框图标 + 语义标签 */
      doc.querySelectorAll('blockquote').forEach(bq => {
        const t = bq.textContent;
        let ic = '📌', lab = '要点';
        if (/红线|免责|务必|注意|默认不行|必做|必须/.test(t)) { ic = '⚠️'; lab = '注意'; }
        else if (/类比|经验法则|为什么|编排逻辑|用法|一页速记/.test(t)) ic = '💡';
        bq.dataset.icon = ic;
        const s = document.createElement('span');
        s.className = 'callout-lab';
        s.textContent = lab;
        bq.appendChild(s);
      });

      /* 代码块：语言标签 + 复制按钮 */
      doc.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (code) {
          const cls = (code.className || '').match(/language-([\w+-]+)/);
          if (cls && cls[1] !== 'text') {
            const l = document.createElement('span');
            l.className = 'langlab';
            l.textContent = cls[1];
            pre.appendChild(l);
          }
        }
        const btn = document.createElement('button');
        btn.className = 'copybtn';
        btn.textContent = '复制';
        btn.onclick = async () => {
          const txt = code ? code.textContent : pre.textContent;
          try {
            await navigator.clipboard.writeText(txt);
            btn.textContent = '已复制 ✓';
            setTimeout(() => btn.textContent = '复制', 1500);
          } catch (e) { btn.textContent = '复制失败'; }
        };
        pre.appendChild(btn);
      });

      /* ===== 批注引擎 =====
         在正文中搜索 anchor 短语，用 <span class="anno"> 包住，
         悬停/长按时显示 .anno-pop 卡片（fixed 定位到角标旁）。 */
      const pop = $('#annoPop');
      ANNOS.forEach((anno, i) => {
        const found = wrapFirstMatch(doc, anno.anchor);
        if (found) {
          found.dataset.annoI = i + 1;
          found.dataset.annoKey = i;
        } else {
          console.warn('anno anchor not found:', anno.anchor);
        }
      });
      function wrapFirstMatch(root, anchor) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode(n) {
            if (!n.nodeValue.includes(anchor)) return NodeFilter.FILTER_REJECT;
            if (n.parentElement.closest('pre,script,.anno')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        let node;
        while ((node = walker.nextNode())) {
          const idx = node.nodeValue.indexOf(anchor);
          const textNode = node;
          const span = document.createElement('span');
          span.className = 'anno';
          const before = textNode.nodeValue.slice(0, idx);
          const after = textNode.nodeValue.slice(idx + anchor.length);
          const parent = textNode.parentNode;
          if (before) parent.insertBefore(document.createTextNode(before), textNode);
          span.textContent = anchor;
          parent.insertBefore(span, textNode);
          if (after) parent.insertBefore(document.createTextNode(after), textNode);
          parent.removeChild(textNode);
          return span;
        }
        return null;
      }
      doc.querySelectorAll('.anno').forEach(sp => {
        const show = () => {
          const a = ANNOS[+sp.dataset.annoKey];
          pop.innerHTML = '<span class="ttl">' + a.title + '</span>' + a.html;
          pop.style.display = 'block';
          const r = sp.getBoundingClientRect();
          const vw = innerWidth, vh = innerHeight;
          const pw = pop.offsetWidth, ph = pop.offsetHeight;
          let top = r.bottom + 8, left = Math.max(12, Math.min(r.left, vw - pw - 12));
          if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 8);
          pop.style.top = top + 'px';
          pop.style.left = left + 'px';
        };
        const hide = () => { pop.style.display = 'none'; };
        sp.addEventListener('mouseenter', show);
        sp.addEventListener('mouseleave', hide);
        sp.addEventListener('focus', show); sp.addEventListener('blur', hide);
        sp.tabIndex = 0;
        sp.addEventListener('click', e => {
          e.preventDefault();
          pop.style.display === 'block' ? hide() : show();
        });
        addEventListener('scroll', hide, { passive: true });
      });

      /* 阅读进度条 */
      const bar = $('#progress');
      addEventListener('scroll', () => {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0).toFixed(1) + '%';
      }, { passive: true });
    } catch (e) {
      $('#loading').remove();
      const err = $('#err');
      err.style.display = 'block';
      err.innerHTML = '<p>加载 index.md 失败：' + e +
        '</p><p>请确认 index.md 与 index.html 在同一目录（仓库根目录）。</p>';
    }
    }

    /* ===== 邀请码门（Web Crypto 校验 + 24h 记忆） ===== */
    const INVITE_HASH = 'b97b94c8f7b033e6696a0ab00388f80b65891e16a4a4cf59d1c7ba4e72dff404';
    const INVITE_SALT = 'ai-handbook-2026';
    const INVITE_TTL = 86400000;
    const INVITE_KEY = 'invite-auth';
    const gate = $('#gate'), input = $('#inviteInput'), btn = $('#inviteBtn'),
          errEl = $('#inviteErr'), form = $('#inviteForm');

    async function sha256hex(s) {
      const buf = await crypto.subtle.digest(
        'SHA-256', new TextEncoder().encode(s + INVITE_SALT));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const stored = () => {
      try { return JSON.parse(localStorage.getItem(INVITE_KEY) || 'null'); }
      catch (e) { return null; }
    };
    const isAuthed = () => {
      const s = stored();
      return s && s.hash === INVITE_HASH && (Date.now() - s.ts) < INVITE_TTL;
    };

    const setBusy = b => { btn.disabled = b; btn.textContent = b ? '校验中…' : '进入'; };

    const reveal = () => { gate.style.display = 'none'; loadContent(); };
    const showError = msg => { errEl.textContent = msg; input.focus(); };

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const val = input.value;
      if (!val) { showError('请输入邀请码'); return; }
      setBusy(true);
      const h = await sha256hex(val);
      setBusy(false);
      if (h === INVITE_HASH) {
        localStorage.setItem(INVITE_KEY, JSON.stringify({ hash: h, ts: Date.now() }));
        gate.style.display = 'none';
        loadContent();
      } else {
        showError('邀请码不正确，请重试。');
        input.select();
      }
    });

    if (isAuthed()) reveal();
    else {
      gate.style.display = 'flex';
      setTimeout(() => input.focus(), 0);
    }
  })();
  </script>
</body>
</html>
