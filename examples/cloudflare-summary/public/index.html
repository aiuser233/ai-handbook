<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>公开文本摘要练习</title><style>body{max-width:760px;margin:40px auto;padding:20px;font:16px/1.7 system-ui}textarea,input{box-sizing:border-box;width:100%;padding:10px;font:inherit}button{padding:10px 16px;margin-top:12px}pre{white-space:pre-wrap}label{display:block;margin:16px 0 4px}</style>
<h1>公开文本摘要练习</h1><p>只输入获准使用的公开或合成文本，勿输入内部材料、客户信息或密钥。需管理员配置服务；生成摘要要核对原文。</p>
<form id="form"><label for="token">本工具访问口令（不是模型 API key；仅当前页面使用）</label><input id="token" type="password" autocomplete="off" required>
<label for="text">文本（最多 6000 字符）</label><textarea id="text" rows="10" maxlength="6000" required></textarea>
<button id="submit">生成摘要</button><button id="cancel" type="button" disabled>取消等待</button></form>
<p id="status" role="status"></p><pre id="result"></pre>
<script>
const form=document.getElementById('form'),status=document.getElementById('status'),result=document.getElementById('result'),button=document.getElementById('submit'),cancel=document.getElementById('cancel');let controller;
form.addEventListener('submit',async e=>{e.preventDefault();controller=new AbortController();button.disabled=true;cancel.disabled=false;result.textContent='';status.textContent='处理中…';try{const res=await fetch('/api/summary',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+document.getElementById('token').value},body:JSON.stringify({text:document.getElementById('text').value})});const data=await res.json();if(!res.ok)throw new Error('请求失败 '+res.status+'：'+(data.error||''));result.textContent=data.summary;status.textContent='已返回，请对照原文复核。';}catch(err){status.textContent=err.name==='AbortError'?'已取消等待；服务端已开始的请求仍可能计费。':err.message;}finally{button.disabled=false;cancel.disabled=true;}});cancel.onclick=()=>controller?.abort();
</script></html>
